# iMessage AI Video Digest Configuration

thread:
  name: "AI Masterminds"
  participants:
    - "REDACTED"
    - "REDACTED"
  trusted: true  # All links from this thread are assumed AI-relevant as a fallback

messages_db: "~/Library/Messages/chat.db"

schedule:
  day: "monday"
  time: "11:00"
  timezone: "America/Los_Angeles"

lookback_days: 7

supported_domains:
  # All links are now processed — these are just noted for reference
  - "youtube.com"
  - "youtu.be"
  - "x.com"
  - "twitter.com"
  - "github.com"
  - "arxiv.org"
  - "substack.com"
  - "medium.com"
  - "any web link"

transcription:
  model: "small"
  engine: "faster-whisper"

ai_classification:
  qualifying_topics:
    - "AI models"
    - "LLMs"
    - "generative AI"
    - "AI agents"
    - "multimodal AI"
    - "machine learning"
    - "deep learning"
    - "AI infrastructure"
    - "AI startups"
    - "AI research"
    - "robotics"
  min_confidence: "medium"

github_pages:
  repo_url: "https://github.com/meechi3t/iMessage-AI-Digest"
  site_url: "https://meechi3t.github.io/iMessage-AI-Digest"
  publish_dir: "docs"

paths:
  state_dir: "data/state"
  logs_dir: "data/logs"
  digests_dir: "weekly-digests"
  docs_dir: "docs"
  thread_cache: "data/state/thread_cache.json"
  processed_links: "data/state/processed_links.json"
  video_catalog: "data/state/video_catalog.json"

test_mode:
  enabled: false
  send_to: "+REDACTED"  # Send digest to yourself instead of the group

ai_tags:
  - "agents"
  - "LLMs"
  - "multimodal"
  - "AI startups"
  - "infrastructure"
  - "coding tools"
  - "robotics"
  - "research"
  - "open source"
  - "safety"
