<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Digest — Archive</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-muted: #666666;
            --heading: #16213e;
            --border: #e8e8e8;
            --link: #0f3460;
            --hover-bg: #f0f4ff;
            --shadow: rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --card-bg: #161b22;
                --text: #e6edf3;
                --text-muted: #8b949e;
                --heading: #e6edf3;
                --border: #30363d;
                --link: #58a6ff;
                --hover-bg: #1f2430;
                --shadow: rgba(0,0,0,0.3);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            padding: 2rem 1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 10px var(--shadow);
            padding: 2.5rem;
        }
        h1 { font-size: 1.8rem; margin-bottom: 1rem; color: var(--heading); }
        .digest-entry {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.2rem;
            margin: 0.8rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .digest-entry:hover { background: var(--hover-bg); }
        .digest-date { font-weight: 600; color: var(--link); }
        .digest-stats { color: var(--text-muted); font-size: 0.9rem; }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Video Digest Archive</h1>
        <p><a href="latest.html">View Latest Digest</a></p>
        <hr style="margin: 1rem 0; border: none; border-top: 1px solid var(--border);">
        <div class="digest-entry"><span class="digest-date"><a href="2026-03-15.html">2026-03-15</a></span><span class="digest-stats">7 videos</span></div>
        <div class="footer">
            Generated by Tip10 Technologies
        </div>
    </div>
</body>
</html>
